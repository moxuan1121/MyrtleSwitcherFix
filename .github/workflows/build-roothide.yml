name: Build RootHide arm64e package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Makefile"
      - "control"
      - "Tweak.xm"
      - "MyrtleSwitcherFix.plist"
      - ".github/workflows/build-roothide.yml"
  pull_request:
    paths:
      - "Makefile"
      - "control"
      - "Tweak.xm"
      - "MyrtleSwitcherFix.plist"
      - ".github/workflows/build-roothide.yml"

permissions:
  contents: read

concurrency:
  group: roothide-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS 15.6 RootHide arm64e
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: brew install dpkg ldid xz

      - name: Install RootHide Theos
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"

      - name: Build diagnostic package
        shell: bash
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1

      - name: Verify architecture and uninstall safety
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one .deb, found ${#packages[@]}" >&2
            exit 1
          fi

          package="${packages[0]}"
          architecture="$(dpkg-deb -f "$package" Architecture)"
          if [[ "$architecture" != "iphoneos-arm64e" ]]; then
            echo "Unsafe package architecture: $architecture" >&2
            exit 1
          fi

          inspection="$RUNNER_TEMP/debian-control"
          mkdir -p "$inspection"
          dpkg-deb -e "$package" "$inspection"
          for script in preinst postinst prerm postrm; do
            if [[ -e "$inspection/$script" ]]; then
              echo "Unexpected maintainer script found: $script" >&2
              exit 1
            fi
          done

          if ! dpkg-deb -f "$package" Depends | grep -q 'mobilesubstrate'; then
            echo "Missing MobileSubstrate/ElleKit compatibility dependency" >&2
            exit 1
          fi

          echo "PACKAGE_PATH=$package" >> "$GITHUB_ENV"
          shasum -a 256 "$package" | tee packages/SHA256SUMS.txt
          dpkg-deb -I "$package"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: MyrtleSwitcherFix-iOS15.6-RootHide-arm64e
          path: |
            ${{ env.PACKAGE_PATH }}
            packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
