name: Build RootHide arm64e package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - performance/no-logging
    paths:
      - "Makefile"
      - "control"
      - "Tweak.xm"
      - "MyrtleSwitcherFix.plist"
      - ".github/workflows/build-roothide.yml"
  pull_request:
    paths:
      - "Makefile"
      - "control"
      - "Tweak.xm"
      - "MyrtleSwitcherFix.plist"
      - ".github/workflows/build-roothide.yml"

permissions:
  contents: read

concurrency:
  group: roothide-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS 15.6 RootHide arm64e
    # arm64e system processes on iOS 15 require Apple's new arm64e ABI.
    # Linux linkers emit the legacy ABI (CPU subtype capability 0x00), which
    # loads but crashes on Objective-C constant objects without oldabi.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install make xz ldid dpkg

      - name: Checkout RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          ref: master
          submodules: recursive
          path: theos

      - name: Checkout iOS SDK
        uses: actions/checkout@v4
        with:
          repository: theos/sdks
          sparse-checkout: iPhoneOS16.5.sdk
          path: theos/sdks

      - name: Configure Theos
        shell: bash
        run: echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          gmake clean package FINALPACKAGE=1

      - name: Verify architecture and uninstall safety
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(packages/*.deb)
          if (( ${#packages[@]} != 1 )); then
            echo "Expected exactly one .deb, found ${#packages[@]}" >&2
            exit 1
          fi

          package="${packages[0]}"
          package_id="$(dpkg-deb -f "$package" Package)"
          if [[ "$package_id" != "com.moxuan.myrtleswitcherfix" ]]; then
            echo "Unexpected package identifier: $package_id" >&2
            exit 1
          fi
          architecture="$(dpkg-deb -f "$package" Architecture)"
          if [[ "$architecture" != "iphoneos-arm64e" ]]; then
            echo "Unsafe package architecture: $architecture" >&2
            exit 1
          fi

          inspection="$RUNNER_TEMP/debian-control"
          mkdir -p "$inspection"
          dpkg-deb -e "$package" "$inspection"
          for script in preinst postinst prerm postrm; do
            if [[ -e "$inspection/$script" ]]; then
              echo "Unexpected maintainer script found: $script" >&2
              exit 1
            fi
          done

          payload="$RUNNER_TEMP/debian-payload"
          mkdir -p "$payload"
          dpkg-deb -x "$package" "$payload"
          dylib="$payload/Library/MobileSubstrate/DynamicLibraries/MyrtleSwitcherFix.dylib"
          if [[ ! -f "$dylib" ]]; then
            echo "Expected tweak dylib is missing" >&2
            exit 1
          fi
          macho_info="$(file "$dylib")"
          echo "$macho_info"
          if [[ "$macho_info" != *"arm64e"* ]]; then
            echo "Wrong Mach-O architecture; expected native arm64e for A15 SpringBoard" >&2
            exit 1
          fi

          if [[ "$GITHUB_REF" == "refs/heads/performance/no-logging" ]]; then
            if strings "$dylib" | grep -q 'com.moxuan.myrtleswitcherfix.log'; then
              echo "Performance build still contains the diagnostic log path" >&2
              exit 1
            fi
            if [[ "$(dpkg-deb -f "$package" Version)" != "0.4.4.1" ]]; then
              echo "Unexpected performance package version" >&2
              exit 1
            fi
          fi

          # New-ABI arm64e uses CPU_SUBTYPE_ARM64E with the capability bit set:
          # raw little-endian cpusubtype 0x80000002. Legacy Linux arm64e is
          # 0x00000002 and crashes on iOS 15 unless the system-wide oldabi shim
          # is installed, which this package deliberately does not require.
          python3 - "$dylib" <<'PY'
          import struct
          import sys
          with open(sys.argv[1], "rb") as stream:
              header = stream.read(12)
          subtype = struct.unpack_from("<I", header, 8)[0]
          print(f"Mach-O CPU subtype: 0x{subtype:08x}")
          if subtype != 0x80000002:
              raise SystemExit("Legacy arm64e ABI detected; refusing unsafe package")
          PY

          if ! dpkg-deb -f "$package" Depends | grep -q 'mobilesubstrate'; then
            echo "Missing MobileSubstrate/ElleKit compatibility dependency" >&2
            exit 1
          fi
          if [[ "$(dpkg-deb -f "$package" Conflicts)" != *"com.local.myrtleswitcherfix"* ]] ||
             [[ "$(dpkg-deb -f "$package" Replaces)" != *"com.local.myrtleswitcherfix"* ]]; then
            echo "Missing safe migration metadata for the old package identifier" >&2
            exit 1
          fi

          echo "PACKAGE_PATH=$package" >> "$GITHUB_ENV"
          shasum -a 256 "$package" | tee packages/SHA256SUMS.txt
          dpkg-deb -I "$package"

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: MyrtleSwitcherFix-iOS15.6-RootHide-arm64e
          path: |
            ${{ env.PACKAGE_PATH }}
            packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
